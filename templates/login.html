{% extends "base.html" %}{% block body %}
<div class="container" style="max-width:380px;margin-top:12vh"><div class="card shadow-sm"><div class="card-body p-4">
<h4 class="mb-3"><i class="bi bi-shop"></i> POS Login</h4>
<form method="post">{% csrf_token %}{{ form.non_field_errors }}
<input class="form-control mb-2" name="username" placeholder="Username" required autofocus>
<input class="form-control mb-3" type="password" name="password" placeholder="Password" required>
<button class="btn btn-primary w-100">Sign in</button></form></div></div></div>{% endblock %}
